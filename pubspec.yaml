name: food_delivery_app
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.1.2
  otp_text_field: ^1.0.0
  random_string: ^2.3.1
  shared_preferences: ^2.5.2
  flutter_dotenv: ^5.2.1
  otp_pin_field: ^1.4.0
  pin_code_fields: ^8.0.1
  page_transition: ^2.2.1
  flutter_vector_icons: ^2.0.0
  custom_map_markers: ^0.0.2+1
  get: ^4.7.2
  flutter_hooks: ^0.21.2
  http: ^1.4.0
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  phone_otp_verification: ^1.0.3
  flutter_svg: ^2.1.0
  lottie: ^3.3.1
  get_storage: ^2.1.1
  flutter_otp_text_field: ^1.5.1+1
  intl: ^0.19.0

  google_sign_in: ^6.2.1
  google_maps_flutter: ^2.12.2
  geolocator: ^14.0.1
  firebase_auth: ^5.6.0
  firebase_core: ^3.14.0
  razorpay_flutter: ^1.4.0
  fluttertoast: ^8.2.12
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/iimg/
    - .env
    - assets/
    - assets/empty_cart.json

  fonts:
    - family: Metropolis
      fonts:
        - asset: assets/fonts/Metropolis-Regular.otf
        - asset: assets/fonts/Metropolis-Medium.otf
          weight: 500
        - asset: assets/fonts/Metropolis-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Metropolis-Bold.otf
          weight: 700
        - asset: assets/fonts/Metropolis-ExtraBold.otf
          weight: 800

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
